[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nanochat*"]

[project]
name = "nanochat"
version = "0.1.0"
description = "Training code for Mixture-of-Memory Embeddings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "filelock>=3.19.1",
    "kernels>=0.13.0",
    "numpy>=2.0.0",
    "pyarrow>=21.0.0",
    "psutil>=7.1.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "torch>=2.9.0",
    "wandb>=0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# target torch to cuda 12.8 or CPU
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.optional-dependencies]
cpu = [
    "torch>=2.9.1",
]
gpu = [
    "torch>=2.9.1",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]
